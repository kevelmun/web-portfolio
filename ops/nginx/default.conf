map $uri $portfolio_cache_control {
  default "no-cache";
  ~^/_astro/ "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name www.kevelmun.dev;
  return 301 https://kevelmun.dev$request_uri;
}

server {
  listen 80 default_server;
  server_name kevelmun.dev _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  add_header Cache-Control $portfolio_cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  error_page 404 /404.html;
  error_page 410 /410.html;
  location = /404.html { internal; }
  location = /410.html { internal; }

  # Servir la home directamente evita una redirección interna al alias index.html.
  location = / { try_files /index.html =404; }
  location = /index.html { return 301 /$is_args$args; }
  location = /index.htm { return 301 /$is_args$args; }

  # La antigua interfaz IDE se ha retirado y no tiene equivalente.
  location = /workspace { return 410; }
  location = /workspace/ { return 410; }

  location = /sitemap.xml {
    types { application/xml xml; }
    try_files $uri =404;
  }
  location = /site.webmanifest {
    types { application/manifest+json webmanifest; }
    try_files $uri =404;
  }

  # Sin fallback SPA: los archivos y las rutas desconocidas devuelven 404.
  location / { try_files $uri $uri/ =404; }
}
